[project]
name = "cloudcoil.models.crossplane"
version = "0.0.0"
description = "Versioned crossplane models for cloudcoil"
authors = [{ name = "Sambhav Kothari", email = "sambhavs.email@gmail.com" }]
maintainers = [{ name = "Sambhav Kothari", email = "sambhavs.email@gmail.com" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3.14",
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cloudcoil>=0.7.1,<0.8",
]
keywords = ["cloud-native", "kubernetes", "crossplane", "pydantic", "python", "async", "cloudcoil", "cloudcoil-models"]

[project.urls]
Homepage = "https://github.com/cloudcoil/cloudcoil"
Documentation = "https://cloudcoil.github.io/cloudcoil"
Repository = "https://github.com/cloudcoil/models-crossplane"
Issues = "https://github.com/cloudcoil/models-crossplane/issues"
Changelog = "https://github.com/cloudcoil/models-crossplane/releases"

[build-system]
requires = ["hatchling>=1.18.0"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", # pycodestyle
    "F", # pyflakes
    "B", # flake8-bugbear
    "N", # pep8-naming
    "I", # isort
]
ignore = ["E203", "B008", "N818", "E501", "B904"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -ra -q --cov=cloudcoil --cov-report=xml --cov-report=term -vvv --junitxml=junit.xml -o junit_family=legacy"
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "packaging>=24.2",
    "mypy>=1.19",
    "pyright>=1.1.407",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.3",
    "mkdocstrings>=0.24.0",
    "mkdocstrings-python>=1.7.5",
    "mkdocs-autorefs>=0.5.0",
    "pytest>=8.3.4",
    "pytest-cov>=4.1.0",
    "ruff>=0.14",
    "types-pyyaml>=6.0.12.20241221",
    "ipython>=8.12.3",
    "pytest-sugar>=1.0.0",
    "pytest-asyncio>=0.25.0",
    "cloudcoil[codegen,test]>=0.7.1,<0.8"
]

[tool.mypy]
python_version = "3.14"

[tool.coverage.run]
omit = ["cloudcoil/models/**"]

[tool.hatch.build.targets.wheel]
only-include = ["cloudcoil"]

[[tool.cloudcoil.codegen.models]]
# Python package for generated models
namespace = "cloudcoil.models.crossplane"
input = [
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_compositeresourcedefinitions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_compositionrevisions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_compositions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_environmentconfigs.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_managedresourceactivationpolicies.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_managedresourcedefinitions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/apiextensions.crossplane.io_usages.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/ops.crossplane.io_cronoperations.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/ops.crossplane.io_operations.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/ops.crossplane.io_watchoperations.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_configurationrevisions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_configurations.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_deploymentruntimeconfigs.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_functionrevisions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_functions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_imageconfigs.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_locks.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_providerrevisions.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/pkg.crossplane.io_providers.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/protection.crossplane.io_clusterusages.yaml",
    "https://raw.githubusercontent.com/crossplane/crossplane/refs/tags/v2.4.0/cluster/crds/protection.crossplane.io_usages.yaml",
]
[[tool.mypy.overrides]]
# Crossplane's runtimeConfigRef defaults are dictionaries. Pydantic's
# validate_default converts them into typed models (covered by test_resources.py).
module = [
    "cloudcoil.models.crossplane.pkg_crossplane_io.v1",
    "cloudcoil.models.crossplane.pkg_crossplane_io.v1beta1",
]
disable_error_code = ["assignment"]
